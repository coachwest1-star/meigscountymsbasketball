<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meigs County Tigers - Blanket Sale</title>

  <meta
    name="description"
    content="Official Meigs County Tigers Blanket Fundraiser Order Form"
  >

  <style>
    :root {
      --black: #111111;
      --orange: #c65320;
      --orange-dark: #a94017;
      --background: #f3eee5;
      --card: #ffffff;
      --text: #222222;
      --muted: #64748b;
      --border: #d1d5db;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--background);
      color: var(--text);
    }

    .header {
      background: var(--black);
      color: white;
      border-bottom: 5px solid var(--orange);
    }

    .header-inner {
      max-width: 1450px;
      margin: auto;
      padding: 16px 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .header h1 {
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.1;
    }

    .header p {
      margin-top: 6px;
      font-size: 16px;
    }

    .page {
      max-width: 1450px;
      margin: auto;
      padding: 32px;

      display: grid;

      grid-template-columns:
        minmax(350px, 1fr)
        minmax(450px, 1fr);

      gap: 28px;
      align-items: start;
    }

    .product-card {
      background: var(--black);
      overflow: hidden;
      border-radius: 16px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.13);
    }

    .blanket-image {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .product-footer {
      background: var(--black);
      color: white;
      padding: 20px 24px;
    }

    .price {
      color: #ffd5bc;
      font-size: 32px;
      font-weight: 800;
    }

    .payment-note {
      margin-top: 2px;
      font-size: 17px;
    }

    .form-card {
      background: white;
      border-radius: 18px;
      padding: 32px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.10);
    }

    .form-card h2 {
      font-size: 30px;
      margin-bottom: 18px;
    }

    .intro {
      font-size: 17px;
      margin-bottom: 28px;
      line-height: 1.45;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #b8b8b8;
      border-radius: 9px;
      padding: 14px 13px;
      font-size: 17px;
      background: white;
      color: #111;
    }

    input:focus,
    select:focus {
      outline: 3px solid rgba(198, 83, 32, 0.18);
      border-color: var(--orange);
    }

    .total-box {
      background: #f6f0e6;
      border-left: 7px solid var(--orange);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
      font-size: 21px;
      font-weight: 800;
    }

    .submit-button {
      width: 100%;
      border: none;
      background: var(--orange);
      color: white;
      padding: 16px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .submit-button:hover {
      background: var(--orange-dark);
    }

    .submit-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 17px;
      border-radius: 10px;
      margin-top: 18px;
      font-size: 16px;
      line-height: 1.4;
    }

    .success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
    }

    .error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
    }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .product-card,
      .form-card {
        max-width: 650px;
        margin: auto;
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        padding: 15px 18px;
      }

      .page {
        padding: 15px;
      }

      .form-card {
        padding: 24px 20px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .form-card h2 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <div class="header-inner">

      <div>
        <h1>
          Meigs County Tigers Blanket Sale
        </h1>

        <p>
          Order your blanket today for $40 each.
        </p>
      </div>

    </div>

  </header>


  <main class="page">

    <section class="product-card">

      <img
        class="blanket-image"
        src="YOUR-BLANKET-IMAGE-URL-HERE"
        alt="Meigs County Tigers Blanket"
      >

      <div class="product-footer">

        <div class="price">
          $40 each
        </div>

        <div class="payment-note">
          Payment may be made by cash or check.
        </div>

      </div>

    </section>


    <section class="form-card">

      <h2>
        Blanket Order Form
      </h2>

      <p class="intro">
        Complete the form below. You will receive an email
        confirmation and another email when your order is
        ready for pickup.
      </p>


      <form
        id="orderForm"
        method="POST"
        action="https://script.google.com/macros/s/AKfycbxqXrr2X9oLeesUz_1aIMGU9QdqLb0ZO-PTouv62-d4ivts-31wmkBk9HwW-HSy7FyOfA/exec"
        target="submissionFrame"
      >

        <div class="row">

          <div class="field">

            <label for="firstName">
              First name *
            </label>

            <input
              id="firstName"
              name="firstName"
              type="text"
              autocomplete="given-name"
              required
            >

          </div>


          <div class="field">

            <label for="lastName">
              Last name *
            </label>

            <input
              id="lastName"
              name="lastName"
              type="text"
              autocomplete="family-name"
              required
            >

          </div>

        </div>


        <div class="field">

          <label for="phone">
            Phone number *
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            required
          >

        </div>


        <div class="field">

          <label for="email">
            Email address *
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          >

        </div>


        <div class="row">

          <div class="field">

            <label for="quantity">
              Number of blankets *
            </label>

            <input
              id="quantity"
              name="quantity"
              type="number"
              min="1"
              max="25"
              value="1"
              required
            >

          </div>


          <div class="field">

            <label for="paymentMethod">
              How will you be paying? *
            </label>

            <select
              id="paymentMethod"
              name="paymentMethod"
              required
            >

              <option value="">
                Choose one
              </option>

              <option value="Cash">
                Cash
              </option>

              <option value="Check">
                Check
              </option>

            </select>

          </div>

        </div>


        <div class="total-box">

          Order total:
          <span id="orderTotal">
            $40.00
          </span>

        </div>


        <button
          id="submitButton"
          class="submit-button"
          type="submit"
        >
          Place Order
        </button>


        <div
          id="responseMessage"
          class="message"
        ></div>

      </form>


      <iframe
        name="submissionFrame"
        id="submissionFrame"
        style="display:none;"
      ></iframe>

    </section>

  </main>


  <script>

    const PRICE_PER_BLANKET = 40;

    const form =
      document.getElementById("orderForm");

    const quantityInput =
      document.getElementById("quantity");

    const totalDisplay =
      document.getElementById("orderTotal");

    const submitButton =
      document.getElementById("submitButton");

    const responseMessage =
      document.getElementById("responseMessage");

    const submissionFrame =
      document.getElementById("submissionFrame");


    let submitting = false;
    let submittedQuantity = 1;


    function updateTotal() {

      let quantity =
        parseInt(
          quantityInput.value,
          10
        );

      if (
        isNaN(quantity) ||
        quantity < 1
      ) {
        quantity = 1;
      }

      const total =
        quantity *
        PRICE_PER_BLANKET;

      totalDisplay.textContent =
        "$" +
        total.toFixed(2);
    }


    quantityInput.addEventListener(
      "input",
      updateTotal
    );


    form.addEventListener(
      "submit",
      function(event) {

        if (!form.checkValidity()) {

          event.preventDefault();

          form.reportValidity();

          return;
        }


        submittedQuantity =
          parseInt(
            quantityInput.value,
            10
          ) || 1;


        submitting = true;


        submitButton.disabled =
          true;


        submitButton.textContent =
          "Submitting Order...";


        responseMessage.style.display =
          "none";


        responseMessage.className =
          "message";

      }
    );


    submissionFrame.addEventListener(
      "load",
      function() {

        if (!submitting) {
          return;
        }


        submitting = false;


        const total =
          submittedQuantity *
          PRICE_PER_BLANKET;


        responseMessage.innerHTML =
          "<strong>Order received!</strong><br>" +
          "Your order has been submitted.<br>" +
          "Total: $" +
          total.toFixed(2) +
          "<br><br>" +
          "Please check your email for your order confirmation and order number.";


        responseMessage.className =
          "message success";


        responseMessage.style.display =
          "block";


        form.reset();


        quantityInput.value =
          1;


        updateTotal();


        submitButton.disabled =
          false;


        submitButton.textContent =
          "Place Order";


        responseMessage.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      }
    );


    updateTotal();

  </script>

</body>
</html>
