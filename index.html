<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meigs County Tigers - Blanket Sale</title>
  <style>
    :root {
      --primary: #111111;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 420px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background-color: #fef3c7;
      color: #92400e;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 16px 20px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .btn:hover {
      background-color: #333333;
    }

    .instructions {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.85rem;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Official Fundraiser</span>
    <h1>Meigs County Tigers</h1>
    <p class="subtitle">Blanket Order Form</p>

    <!-- DIRECT LINK TO NEW GMAIL DEPLOYMENT -->
    <a 
      href="https://script.google.com/macros/s/AKfycbx5RU05Tzrh3bsp6WL39sO3PkOjLyDk0vp5mNMGtQCeyutnuRu3dpJC2SO5ZFT8jpAL-A/exec" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="btn"
    >
      Open Order Form &rarr;
    </a>

    <div class="instructions">
      <p><strong>Note for Facebook / Messenger users:</strong></p>
      <p>If the button doesn't open, tap the <strong>•••</strong> (three dots) in the top right corner and choose <strong>"Open in Browser"</strong>.</p>
    </div>
  </div>

</body>
</html>
