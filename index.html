<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meigs County Tigers - Blanket Sale</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 420px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #111111;
      margin-bottom: 6px;
    }

    p {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .btn {
      display: block;
      background-color: #111111;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 16px 20px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn:hover {
      background-color: #333333;
    }

    .note {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Meigs County Tigers</h1>
    <p>Official Blanket Order Form</p>

    <!-- DIRECT LINK TO GOOGLE APPS SCRIPT -->
    <a 
      href="https://script.google.com/macros/s/AKfycbxqXrr2X9oLeesUz_1aIMGU9QdqLb0ZO-PTouv62-d4ivts-31wmkBk9HwW-HSy7FyOfA/exec" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="btn"
    >
      Click Here to Order Blankets &rarr;
    </a>

    <div class="note">
      If opening from Facebook or Instagram, tap the button above or select <strong>"Open in Browser"</strong> from your menu.
    </div>
  </div>

</body>
</html>
